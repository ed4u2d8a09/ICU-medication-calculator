<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICU Medication Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>ICU Medication Calculator</h1>
                <p>Drip-rate reference based on standard ICU preparations</p>
            </div>
        </header>

        <section class="weight-input-section" aria-label="Patient weight">
            <div class="input-group">
                <label for="weight">Patient Weight</label>
                <div class="weight-field">
                    <input type="number" id="weight" placeholder="60" min="1" step="0.1" value="60" inputmode="decimal">
                    <span class="weight-unit">kg</span>
                </div>
            </div>
        </section>

        <main id="drug-list" class="drug-list">
            <!-- Drug cards will be injected here by JS -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
