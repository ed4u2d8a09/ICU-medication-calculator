<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICU Medication Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>ICU Medication Calculator</h1>
            <p>Smart drip rate calculator based on standard preparations</p>
        </header>

        <section class="weight-input-section glass-panel">
            <div class="input-group">
                <label for="weight">Patient Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 60" min="1" step="0.1" value="60">
            </div>
        </section>

        <section id="drug-list" class="drug-list">
            <!-- Drug cards will be injected here by JS -->
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
