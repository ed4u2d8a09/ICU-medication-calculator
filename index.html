<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICU Medication Calculator</title>
    <!-- GitHub Pages can't set response headers, so the CSP lives here. Everything
         is same-origin and nothing is fetched at runtime; keep it that way. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <!-- Bump ?v= on every styles.css / script.js change: GitHub Pages serves
         assets with a 10-minute cache, so a fixed filename can hand a visitor
         new HTML with stale CSS/JS. -->
    <link rel="stylesheet" href="styles.css?v=20261010">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>ICU Medication Calculator</h1>
                <p>Drip-rate reference based on standard ICU preparations</p>
            </div>
        </header>

        <nav class="view-nav" role="tablist" aria-label="計算模式切換">
            <button type="button" class="view-tab is-active" id="tab-drugs" role="tab" aria-selected="true" aria-controls="view-drugs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5 12 5a3.5 3.5 0 0 1 5 5l-7.5 7.5a3.5 3.5 0 0 1-5-5Z"/><path d="m8.5 8.5 5 5"/></svg>
                <span>藥物計算</span>
            </button>
            <button type="button" class="view-tab" id="tab-abg" role="tab" aria-selected="false" aria-controls="view-abg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg>
                <span>ABG 分析</span>
            </button>
        </nav>

        <div class="view" id="view-drugs" role="tabpanel" aria-labelledby="tab-drugs">
            <section class="weight-input-section" aria-label="Patient weight">
                <div class="input-group">
                    <label for="weight">Patient Weight</label>
                    <div class="weight-field">
                        <input type="number" id="weight" placeholder="60" min="1" step="0.1" value="60" inputmode="decimal">
                        <span class="weight-unit">kg</span>
                    </div>
                    <span class="weight-hint">體重變動時，所有 μg/kg/min 藥物的速率會即時重算</span>
                </div>
            </section>

            <main id="drug-list" class="drug-list">
                <!-- Drug cards will be injected here by JS -->
            </main>
        </div>

        <section class="abg-section view is-hidden" id="view-abg" aria-label="ABG analyzer" role="tabpanel" aria-labelledby="tab-abg">
            <div class="abg-card-head">
                <h2 class="category-header">Arterial Blood Gas (ABG) Analyzer</h2>
                <button type="button" class="abg-clear-btn" id="abg-clear">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                    <span>一鍵清除</span>
                </button>
            </div>
            <div class="abg-card">
                <p class="abg-intro">輸入動脈血氣數值，自動判讀<strong>酸鹼代償</strong>與<strong>呼吸衰竭可能原因</strong>（A–a gradient tree）。</p>
                <div class="abg-inputs">
                    <div class="abg-field">
                        <label for="abg-ph">pH</label>
                        <input type="number" id="abg-ph" step="0.01" placeholder="7.40" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-paco2">PaCO₂ / PvCO₂ <span class="abg-u">mmHg</span></label>
                        <input type="number" id="abg-paco2" step="0.1" placeholder="40" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-hco3">HCO₃⁻ <span class="abg-u">mEq/L</span></label>
                        <input type="number" id="abg-hco3" step="0.1" placeholder="24" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-pao2">PaO₂ <span class="abg-u">mmHg</span></label>
                        <input type="number" id="abg-pao2" step="0.1" placeholder="90" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-fio2">FiO₂ <span class="abg-u">%</span></label>
                        <input type="number" id="abg-fio2" step="1" placeholder="21" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-age">Age <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-age" step="1" placeholder="—" inputmode="numeric">
                    </div>
                    <div class="abg-field">
                        <label for="abg-na">Na⁺ <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-na" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-cl">Cl⁻ <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-cl" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-k">K⁺ <span class="abg-u">mEq/L</span></label>
                        <input type="number" id="abg-k" step="0.1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-una">Urine Na⁺ <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-una" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-ucl">Urine Cl⁻ <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-ucl" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-uk">Urine K⁺ <span class="abg-u">optional</span></label>
                        <input type="number" id="abg-uk" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-bp">血壓 <span class="abg-u">代鹼分流</span></label>
                        <select id="abg-bp">
                            <option value="">—</option>
                            <option value="high">Hypertensive 高血壓</option>
                            <option value="normal">Normo-/hypotensive 正常或低</option>
                        </select>
                    </div>
                    <div class="abg-field">
                        <label for="abg-uph">Urine pH <span class="abg-u">RTA 分型</span></label>
                        <input type="number" id="abg-uph" step="0.1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-fehco3">Fe<sub>HCO₃</sub> <span class="abg-u">%</span></label>
                        <input type="number" id="abg-fehco3" step="0.1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-osm">Measured Osm <span class="abg-u">mOsm/kg</span></label>
                        <input type="number" id="abg-osm" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-glu">Glucose <span class="abg-u">mg/dL</span></label>
                        <input type="number" id="abg-glu" step="1" placeholder="—" inputmode="decimal">
                    </div>
                    <div class="abg-field">
                        <label for="abg-bun">BUN <span class="abg-u">mg/dL</span></label>
                        <input type="number" id="abg-bun" step="1" placeholder="—" inputmode="decimal">
                    </div>
                </div>
                <div class="abg-results" id="abg-results" aria-live="polite">
                    <p class="abg-placeholder">填入 pH、PaCO₂、HCO₃⁻ 進行酸鹼分析；再加入 PaO₂ 與 FiO₂ 分析呼吸衰竭原因。</p>
                </div>
                <p class="abg-disclaimer">※ 僅供臨床輔助參考，請結合病史與理學檢查判讀，不可取代醫師臨床判斷。</p>
            </div>
        </section>
    </div>

    <script src="script.js?v=20261010"></script>
</body>
</html>
